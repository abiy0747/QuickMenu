<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>QuickMenu - Offline</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8f8f6;
        color: #1b1b1b;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      .container {
        max-width: 420px;
      }

      .icon {
        font-size: 56px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #6b7280;
        line-height: 1.6;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="icon">📴</div>

      <h1>You're Offline</h1>

      <p>
        QuickMenu could not load this page because there is no
        internet connection.
      </p>
    </div>
  </body>
</html>
